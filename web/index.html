<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Takka — AI Schedule Assistant">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Takka">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Takka</title>
  <link rel="manifest" href="manifest.json">
</head>
  <script>
    window.takkaAudio = {
      ctx: null,
      alarmInterval: null,
      ringtoneTimeout: null,
      getCtx: function() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          return this.ctx;
        } catch(e) {
          return null;
        }
      },
      playTone: function(freq, type, duration, delay, gainLevel) {
        const ctx = this.getCtx();
        if (!ctx) return;
        const now = ctx.currentTime + (delay || 0);
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, now);
        const g = gainLevel !== undefined ? gainLevel : 0.2;
        gain.gain.setValueAtTime(g, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.05);
      },
      playEffect: function(effect, theme) {
        if (theme === 'muted') return;
        const th = theme || 'chimes';
        if (effect === 'task_done') {
          if (th === 'digital') {
            this.playTone(523.25, 'sawtooth', 0.08, 0, 0.1);
            this.playTone(783.99, 'square', 0.12, 0.07, 0.12);
          } else if (th === 'pops') {
            this.playTone(400, 'sine', 0.05, 0, 0.25);
            this.playTone(800, 'sine', 0.08, 0.04, 0.25);
          } else if (th === 'clicks') {
            this.playTone(1200, 'triangle', 0.02, 0, 0.15);
          } else {
            // chimes
            this.playTone(587.33, 'sine', 0.15, 0, 0.2);
            this.playTone(880.00, 'sine', 0.35, 0.08, 0.25);
          }
        } else if (effect === 'event_saved') {
          if (th === 'digital') {
            this.playTone(440, 'square', 0.06, 0, 0.08);
            this.playTone(554.37, 'square', 0.06, 0.06, 0.08);
            this.playTone(659.25, 'square', 0.15, 0.12, 0.1);
          } else if (th === 'pops') {
            this.playTone(350, 'sine', 0.06, 0, 0.2);
            this.playTone(500, 'sine', 0.06, 0.05, 0.2);
            this.playTone(700, 'sine', 0.1, 0.1, 0.2);
          } else if (th === 'clicks') {
            this.playTone(1400, 'triangle', 0.03, 0, 0.15);
            this.playTone(1800, 'triangle', 0.04, 0.03, 0.15);
          } else {
            // chimes - major chord
            this.playTone(523.25, 'sine', 0.2, 0, 0.18);
            this.playTone(659.25, 'sine', 0.25, 0.08, 0.2);
            this.playTone(783.99, 'sine', 0.45, 0.16, 0.25);
          }
        } else if (effect === 'mascot') {
          this.playTone(440, 'triangle', 0.08, 0, 0.2);
          this.playTone(660, 'triangle', 0.12, 0.07, 0.22);
          this.playTone(880, 'sine', 0.2, 0.14, 0.18);
        } else if (effect === 'click') {
          this.playTone(th === 'digital' ? 900 : 700, 'triangle', 0.03, 0, 0.08);
        } else if (effect === 'delete') {
          this.playTone(350, 'sine', 0.08, 0, 0.15);
          this.playTone(220, 'sine', 0.12, 0.06, 0.12);
        }
      },
      playRingtoneOnce: function(ringtoneId) {
        const id = ringtoneId || 'gentle_chime';
        if (id === 'digital_pulse') {
          this.playTone(800, 'square', 0.09, 0, 0.12);
          this.playTone(800, 'square', 0.09, 0.12, 0.12);
          this.playTone(1200, 'square', 0.18, 0.25, 0.15);
        } else if (id === 'zen_bell') {
          this.playTone(432, 'sine', 1.2, 0, 0.3);
          this.playTone(864, 'sine', 0.8, 0.05, 0.15);
        } else if (id === 'radar') {
          this.playTone(950, 'sawtooth', 0.12, 0, 0.12);
          this.playTone(1350, 'sawtooth', 0.18, 0.15, 0.15);
        } else if (id === 'crystal_harp') {
          this.playTone(659.25, 'triangle', 0.2, 0, 0.2);
          this.playTone(830.61, 'triangle', 0.2, 0.08, 0.2);
          this.playTone(987.77, 'triangle', 0.25, 0.16, 0.2);
          this.playTone(1318.51, 'sine', 0.5, 0.24, 0.22);
        } else if (id === 'classic_alarm') {
          this.playTone(880, 'square', 0.15, 0, 0.18);
          this.playTone(659.25, 'square', 0.15, 0.18, 0.18);
          this.playTone(880, 'square', 0.15, 0.36, 0.18);
        } else {
          // gentle_chime
          this.playTone(523.25, 'sine', 0.35, 0, 0.22);
          this.playTone(659.25, 'sine', 0.35, 0.15, 0.22);
          this.playTone(783.99, 'sine', 0.45, 0.3, 0.24);
          this.playTone(1046.50, 'sine', 0.7, 0.45, 0.26);
        }
      },
      playRingtone: function(ringtoneId) {
        this.stopRingtone();
        this.playRingtoneOnce(ringtoneId);
      },
      stopRingtone: function() {
        if (this.ringtoneTimeout) {
          clearTimeout(this.ringtoneTimeout);
          this.ringtoneTimeout = null;
        }
      },
      startAlarm: function(ringtoneId) {
        this.stopAlarm();
        const self = this;
        self.playRingtoneOnce(ringtoneId || 'classic_alarm');
        this.alarmInterval = setInterval(function() {
          self.playRingtoneOnce(ringtoneId || 'classic_alarm');
        }, 1400);
      },
      stopAlarm: function() {
        if (this.alarmInterval) {
          clearInterval(this.alarmInterval);
          this.alarmInterval = null;
        }
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
