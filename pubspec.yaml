name: takka
description: AI Daily Schedule Assistant — local-first timeline scheduler with Arabic support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Data & persistence (spec E/N)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Navigation & state (spec D/O)
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1

  # Notifications (spec G)
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^3.0.0

  # AI layer (spec H/K/M)
  http: ^1.2.2
  speech_to_text: ^6.6.2
  connectivity_plus: ^6.0.5
  flutter_secure_storage: ^10.3.1

  # Home screen widget
  home_widget: ^0.7.0
  font_awesome_flutter: 10.7.0
  url_launcher: ^6.3.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
